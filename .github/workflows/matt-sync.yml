# Sync run: diff Matt Pocock's Upstream skills and open/refresh one Sync PR.
# See docs/adr/0006-track-upstream-matt-skills.md and issue #1.
name: Matt sync

on:
  schedule:
    # Mon/Wed/Fri 06:00 UTC
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:
  pull_request: # ponytail: TEST-ONLY trigger, remove before merge (see base below)

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: https://github.com/mattpocock/skills.git
  SHA_FILE: .github/matt-sync/last-checked-sha

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Diff Upstream and scope changes
        id: scope
        run: |
          set -euo pipefail
          last_sha="$(cat "$SHA_FILE")"
          git clone --quiet "$UPSTREAM" /tmp/upstream
          head_sha="$(git -C /tmp/upstream rev-parse HEAD)"
          count="$(git -C /tmp/upstream rev-list --count "$last_sha..HEAD")"
          actionable=0
          if [ "$count" -gt 0 ]; then
            actionable="$(python3 .github/matt-sync/scope_changes.py \
              --upstream /tmp/upstream --since "$last_sha" --ours skills \
              --out /tmp/report.md)"
          fi
          echo "last_sha=$last_sha"     >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha"     >> "$GITHUB_OUTPUT"
          echo "count=$count"           >> "$GITHUB_OUTPUT"
          echo "actionable=$actionable" >> "$GITHUB_OUTPUT"
          # Advance the SHA and compose the PR body only when there is something to PR.
          if [ "$actionable" -gt 0 ]; then
            echo "$head_sha" > "$SHA_FILE"
            {
              echo "${count} upstream commits since last check."
              echo "Last-checked SHA advanced \`${last_sha}\` → \`${head_sha}\`."
              echo
              cat /tmp/report.md
            } > /tmp/pr-body.md
          fi

      - name: Open/refresh Sync PR
        if: steps.scope.outputs.actionable != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          base: matt-sync-automation # ponytail: TEST-ONLY, revert to `main` before merge
          branch: matt-sync
          title: "Matt sync: upstream skill changes"
          commit-message: "chore(matt-sync): advance last-checked SHA"
          body-path: /tmp/pr-body.md
